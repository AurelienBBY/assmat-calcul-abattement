<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Abattement Ass-Mat</title>

  <!-- Écran (préfixe = ordre de chargement) ; 90-print.css : documents imprimés -->
  <link rel="stylesheet" href="app/styles/00-vars-base.css" />
  <link rel="stylesheet" href="app/styles/10-shell.css" />
  <link rel="stylesheet" href="app/styles/20-calendar.css" />
  <link rel="stylesheet" href="app/styles/30-month-side.css" />
  <link rel="stylesheet" href="app/styles/35-photos-review.css" />
  <link rel="stylesheet" href="app/styles/40-today.css" />
  <link rel="stylesheet" href="app/styles/50-sheet.css" />
  <link rel="stylesheet" href="app/styles/60-profile-year.css" />
  <link rel="stylesheet" href="app/styles/70-onboarding.css" />
  <link rel="stylesheet" href="app/styles/90-print.css" />

  <!-- PWA : installable, hors-ligne, icônes -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#2b2029" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="app/assets/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="app/assets/apple-touch-icon.png" />
</head>
<body>

  <!-- En-tête : nom, 4 onglets (ordinateur), copie de secours, aide -->
  <header class="top">
    <span class="brand">Abattement Ass-Mat</span>
    <nav class="tabs" aria-label="Sections">
      <button type="button" data-tab="today">
        <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg><span>Aujourd'hui</span>
      </button>
      <button type="button" data-tab="month">
        <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Mon mois</span>
      </button>
      <button type="button" data-tab="year">
        <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Mon année</span>
      </button>
      <button type="button" data-tab="profile">
        <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg><span>Mon profil</span>
      </button>
    </nav>
    <div class="top-actions">
      <button type="button" class="backup" id="backup-pill">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18a5 5 0 1 1 .9-9.9A6 6 0 0 1 19 10a4 4 0 0 1-1 8z"/><path d="m9 13 2 2 4-4"/></svg>
        <span class="lbl"></span><span class="lbl-phone"></span>
      </button>
      <button type="button" class="help-btn" id="help-btn" aria-label="Points d'attention" title="Points d'attention">?</button>
    </div>
  </header>

  <!-- Onglet affiché (app/ctrl/*.js) -->
  <main id="main"></main>

  <p class="footer-note">Calcul basé sur le SMIC horaire brut au 1er janvier de l'année — article 80 sexies du Code général des impôts. Aide au calcul, sans valeur justificative.</p>

  <!-- 4 onglets en bas de l'écran (iPhone) -->
  <nav class="bottomtabs" aria-label="Sections">
    <button type="button" data-tab="today">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg><span>Aujourd'hui</span>
    </button>
    <button type="button" data-tab="month">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Mon mois</span>
    </button>
    <button type="button" data-tab="year">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Mon année</span>
    </button>
    <button type="button" data-tab="profile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg><span>Mon profil</span>
    </button>
  </nav>

  <!-- Reprendre une copie de secours (fichier choisi) -->
  <input id="backup-file" type="file" accept=".json,application/json" multiple hidden />
  <input id="photo-file" type="file" accept="image/*" hidden />

  <!-- Document imprimé (seul contenu visible à l'impression, construit au moment d'imprimer) -->
  <div id="print-doc" aria-hidden="true"></div>

  <!-- Modules : l'ordre des <script> fait office de système de modules -->
  <script src="app/config.js"></script>
  <script src="app/lib/utils.js"></script>
  <script src="app/lib/calc.js"></script>
  <script src="app/lib/overtime.js"></script>

  <script src="app/lib/storage/core.js"></script>
  <script src="app/lib/storage/month.js"></script>
  <script src="app/lib/storage/profile.js"></script>
  <script src="app/lib/storage/year-settings.js"></script>
  <script src="app/lib/storage/declared.js"></script>
  <script src="app/lib/storage/sync.js"></script>
  <script src="app/lib/autosave.js"></script>
  <script src="app/lib/image.js"></script>

  <script src="app/lib/compute/children.js"></script>
  <script src="app/lib/compute/year-recap.js"></script>
  <script src="app/lib/compute/month-print.js"></script>
  <script src="app/lib/compute/prefill.js"></script>
  <script src="app/lib/compute/month-view.js"></script>
  <script src="app/lib/compute/punch.js"></script>
  <script src="app/lib/compute/onboarding.js"></script>
  <script src="app/lib/compute/review.js"></script>
  <script src="app/lib/compute/backup-rules.js"></script>
  <script src="app/lib/storage/device.js"></script>
  <script src="app/lib/storage/fiches.js"></script>

  <!-- Rendu (DOM uniquement, jamais de calcul) -->
  <script src="app/lib/render/dom.js"></script>
  <script src="app/lib/render/format.js"></script>
  <script src="app/lib/render/sheet.js"></script>
  <script src="app/lib/render/tip.js"></script>
  <script src="app/lib/render/photo-viewer.js"></script>
  <script src="app/lib/render/overtime-view.js"></script>
  <script src="app/lib/render/calendar.js"></script>
  <script src="app/lib/render/month-panel.js"></script>
  <script src="app/lib/render/fiche-card.js"></script>
  <script src="app/lib/render/review-table.js"></script>
  <script src="app/lib/render/review.js"></script>
  <script src="app/lib/render/day-kid.js"></script>
  <script src="app/lib/render/day-sheet.js"></script>
  <script src="app/lib/render/punch-card.js"></script>
  <script src="app/lib/render/today.js"></script>
  <script src="app/lib/render/profile-child.js"></script>
  <script src="app/lib/render/profile.js"></script>
  <script src="app/lib/render/year-view.js"></script>
  <script src="app/lib/render/prepare-year.js"></script>
  <script src="app/lib/render/backup.js"></script>
  <script src="app/lib/render/onboarding.js"></script>
  <script src="app/lib/render/onb-kids.js"></script>
  <script src="app/lib/render/onb-steps.js"></script>
  <script src="app/lib/render/print-common.js"></script>
  <script src="app/lib/render/print-month.js"></script>
  <script src="app/lib/render/print-year.js"></script>
  <script src="app/lib/render/print-full-year.js"></script>
  <script src="app/lib/render/print-photo.js"></script>

  <!-- Écrans : état, données, gestes -->
  <script src="app/ctrl/ctx.js"></script>
  <script src="app/ctrl/shell.js"></script>
  <script src="app/ctrl/backup.js"></script>
  <script src="app/ctrl/backup-send.js"></script>
  <script src="app/ctrl/backup-folder.js"></script>
  <script src="app/ctrl/backup-import.js"></script>
  <script src="app/ctrl/photos.js"></script>
  <script src="app/ctrl/print.js"></script>
  <script src="app/ctrl/day.js"></script>
  <script src="app/ctrl/review.js"></script>
  <script src="app/ctrl/month-calendar.js"></script>
  <script src="app/ctrl/month.js"></script>
  <script src="app/ctrl/today.js"></script>
  <script src="app/ctrl/profile.js"></script>
  <script src="app/ctrl/profile-edit.js"></script>
  <script src="app/ctrl/year.js"></script>
  <script src="app/ctrl/onboarding-kids.js"></script>
  <script src="app/ctrl/onboarding-steps.js"></script>
  <script src="app/ctrl/onboarding.js"></script>
  <script src="app/app.js"></script>
</body>
</html>
